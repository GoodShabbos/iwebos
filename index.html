<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="iWebOS — a fake desktop experience in the browser, styled after the iPhone's Liquid Glass design." />
  <title>iWebOS</title>

  <!-- liqui (@liqui-design/glass) tokens + surface anatomy, before our styles -->
  <link rel="stylesheet" href="./styles/liqui-tokens.css" />
  <link rel="stylesheet" href="./styles/liqui-glass.css" />

  <!-- Design system & global styles (load order matters) -->
  <link rel="stylesheet" href="./styles/globals.css" />   <!-- reset, variables, @font-face -->
  <link rel="stylesheet" href="./styles/glass.css" />     <!-- liquid-glass surface utilities -->
  <link rel="stylesheet" href="./styles/desktop.css" />   <!-- wallpaper, top bar, dock, icons -->
  <link rel="stylesheet" href="./styles/windows.css" />   <!-- window frames, traffic lights, resize -->
  <link rel="stylesheet" href="./styles/apps.css" />      <!-- per-app inner layouts -->
  <link rel="stylesheet" href="./styles/app-icons.css" /> <!-- icon grid, labels, selection states -->
  <link rel="stylesheet" href="./styles/lockscreen.css" /><!-- lock screen / power overlay -->
  <link rel="stylesheet" href="./styles/taskbar.css" />   <!-- logged-in OS: glass taskbar + raised controls -->
</head>
<body>
  <!-- Boot splash placeholder (liqui-glass surface, styled in stylesheets) -->
  <div id="boot-splash">iWebOS</div>

  <!-- Everything the OS renders lives here; main.js injects the shell -->
  <div id="os-root"></div>

  <!-- shuding/liquid-glass (vanilla, targets window) — classic script -->
  <script src="./js/vendor/shuding-liquid-glass.js"></script>
  <!-- Entry point pulls in the whole ES-module graph (wallpaper, topbar, apps) -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
